<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>getting through - Jay Ghosh</title>
    <link rel="stylesheet" href="../assets/site.css?v=3">
    <style>
      main {
        max-width: 1180px;
      }

      p {
        max-width: 620px;
        margin-top: 0;
      }

      .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
        margin-bottom: 24px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 0.5em;
      }

      .note-section {
        margin: 32px 0;
      }

      .note-section p {
        margin-bottom: 0.5em;
      }

      .note-frame {
        overflow-x: auto;
      }

      .note {
        max-width: 100%;
      }

      .drafts {
        max-width: 520px;
      }

      @media (max-width: 760px) {
        .top-row {
          display: block;
        }

        .top-row img {
          margin-bottom: 24px;
        }

        .note {
          max-width: none;
          width: 720px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>I wanted to figure out how to get greg's attention so:</p>

      <div class="top-row">
        <figure>
          <figcaption>what someone else sent</figcaption>
          <img src="../assets/images/outreach/tweet-email.png" alt="Tweet about an email">
        </figure>

        <figure>
          <figcaption>...and what i did</figcaption>
          <img src="../assets/images/outreach/tweet-note.png" alt="Tweet about a handwritten note">
        </figure>
      </div>

      <section class="note-section">
        <p>the reply</p>

        <div class="note-frame">
          <img class="note" src="../assets/images/outreach/llm-error-note.png" alt="Reply to the LLM error note">
        </div>
      </section>

      <p>a little memorabilia and a few drafts:</p>

      <img class="drafts" src="../assets/images/outreach/drafts.jpg" alt="Draft notes from that night">
    </main>
  </body>
</html>
