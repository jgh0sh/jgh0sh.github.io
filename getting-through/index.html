<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>getting through - jay ghosh</title>
    <link rel="stylesheet" href="../assets/site.css?v=7">
    <style>
      p {
        max-width: 620px;
        margin-top: 0;
      }

      .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        width: min(100%, 860px);
        align-items: start;
        margin: 0 auto 24px;
      }

      figure {
        width: min(92%, 380px);
        margin: 0 auto;
      }

      figure img {
        width: 100%;
        max-width: 100%;
      }

      figcaption {
        margin-bottom: 0.5em;
      }

      .note-section {
        margin: 32px 0;
      }

      .note-section p {
        margin-bottom: 0.5em;
      }

      .note-frame {
        width: min(100%, 600px);
        aspect-ratio: 800 / 286;
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid black;
      }

      .note-frame img {
        width: 229.5%;
        max-width: none;
        margin: 0;
        border: 0;
      }

      .drafts {
        max-width: 480px;
      }

      @media (max-width: 760px) {
        .top-row {
          display: block;
        }

        .top-row img {
          margin-bottom: 24px;
        }

      }
    </style>
  </head>
  <body>
    <main>
      <p>it was my last week in SF and i was just in the mood of doing things, so:</p>

      <div class="top-row">
        <figure>
          <figcaption>what someone else sent</figcaption>
          <img src="../assets/images/outreach/tweet-email.png" alt="Tweet about an email">
        </figure>

        <figure>
          <figcaption>...and what i did</figcaption>
          <img src="../assets/images/outreach/tweet-note.png" alt="Tweet about a handwritten note">
        </figure>
      </div>

      <section class="note-section">
        <p>and i got a reply!</p>

        <div class="note-frame">
          <img class="note" src="../assets/images/outreach/llm-error-note.png" alt="Reply to the LLM error note">
        </div>
      </section>

      <p>a little memorabilia and a few drafts:</p>

      <img class="drafts" src="../assets/images/outreach/drafts.jpg" alt="Draft notes from that night">
    </main>
  </body>
</html>
