<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>getting through - Jay Ghosh</title>
    <style>
      body {
        margin: 32px;
        background: white;
        color: black;
        font-family: "Times New Roman", Times, serif;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.45;
      }

      main {
        max-width: 1180px;
      }

      p {
        max-width: 620px;
        margin-top: 0;
      }

      .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
        margin-bottom: 24px;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .note {
        max-width: 100%;
      }

      .drafts {
        max-width: 520px;
      }

      @media (max-width: 760px) {
        .top-row {
          display: block;
        }

        .top-row img {
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Getting through means getting creative.</p>

      <div class="top-row">
        <img src="../assets/images/outreach/tweet-email.png" alt="Tweet about an email">
        <img src="../assets/images/outreach/tweet-note.png" alt="Tweet about a handwritten note">
      </div>

      <img class="note" src="../assets/images/outreach/llm-error-note.png" alt="Reply to the LLM error note">

      <p>A little memorabilia and a few drafts from that night.</p>

      <img class="drafts" src="../assets/images/outreach/drafts.jpg" alt="Draft notes from that night">
    </main>
  </body>
</html>
