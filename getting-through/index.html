<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>getting through - jay ghosh</title>
    <link rel="stylesheet" href="../assets/site.css?v=15">
    <style>
      p {
        margin-top: 0;
        margin-bottom: 0.5em;
        margin-inline: auto;
        text-align: center;
      }

      .story-image {
        width: 100%;
        max-width: 480px;
      }

      .tweet-crop {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1;
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid black;
      }

      .tweet-crop img {
        width: 100%;
        max-width: none;
        height: 100%;
        margin: 0;
        border: 0;
        object-fit: cover;
        object-position: top center;
      }

      .memorabilia {
        margin-top: 32px;
      }

      .worked {
        margin-top: 1.25em;
      }

      .step-title {
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>i saw greg was annoyed by an email</p>
      <div class="tweet-crop">
        <img src="../assets/images/outreach/tweet-email.png" alt="Original tweet showing the email context">
      </div>

      <p class="step-title">so what i did</p>
      <div class="tweet-crop">
        <img src="../assets/images/outreach/tweet-note.png" alt="Tweet about the handwritten note">
      </div>

      <section class="memorabilia">
        <p>a little memorabilia and a few drafts</p>
        <img class="story-image" src="../assets/images/outreach/drafts.jpg" alt="Draft notes and memorabilia">
        <p class="worked">(and yes it worked)</p>
      </section>
    </main>
  </body>
</html>
