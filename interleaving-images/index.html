<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Models Doing More With Images - Jay Ghosh</title>
    <link rel="stylesheet" href="../assets/site.css?v=15">
    <style>
      .status {
        max-width: 550px;
        margin: 24px auto 0;
        text-align: center;
      }

      .comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        width: min(calc(100vw - 64px), 1120px);
        align-items: start;
        margin-left: 50%;
        transform: translateX(-50%);
      }

      figure {
        width: min(100%, 548px);
        margin: 0 auto;
      }

      .comparison img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 840px) {
        .comparison {
          display: block;
          width: 100%;
          margin-left: 0;
          transform: none;
        }

        figure + figure {
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="comparison">
        <figure>
          <img src="../assets/images/interleaving-images/concept-post.png" alt="A post showing an envisioned ChatGPT response that interleaves image details with instructions">
        </figure>

        <figure>
          <img src="../assets/images/interleaving-images/chatgpt-reference-post.png" alt="A reference post showing ChatGPT's response to the same sewing-machine question">
        </figure>
      </div>

      <p class="status">(now in <a href="https://openai.com/index/gpt-6-for-everyone/">ChatGPT</a> as Intelligent UI)</p>
    </main>
  </body>
</html>
