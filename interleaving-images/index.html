<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>models doing more with images - jay ghosh</title>
    <link rel="stylesheet" href="../assets/site.css?v=9">
    <style>
      .intro {
        max-width: 760px;
        margin: 0 0 24px;
      }

      .comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
      }

      figure {
        width: min(100%, 500px);
        margin: 0 auto;
      }

      figcaption {
        margin-bottom: 0.5em;
        min-height: 1.45em;
      }

      .comparison img {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 1357 / 1502;
        object-fit: contain;
        object-position: top;
        background: white;
      }

      @media (max-width: 840px) {
        .comparison {
          display: block;
        }

        figure + figure {
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="intro">Models can already process and understand images we give them, but I wish they'd interleave parts of those images in their responses to better their answers.</p>

      <div class="comparison">
        <figure>
          <figcaption>what chatgpt responded with</figcaption>
          <img src="../assets/images/interleaving-images/chatgpt-response.png?v=2" alt="A ChatGPT response describing how to thread a sewing machine">
        </figure>

        <figure>
          <figcaption>what i envision</figcaption>
          <img src="../assets/images/interleaving-images/envisioned-response.png?v=2" alt="An envisioned response that interleaves visual instructions with text">
        </figure>
      </div>
    </main>
  </body>
</html>
